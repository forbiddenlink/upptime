# Free-plan Supabase projects pause after 7 days without activity, which takes
# the app offline until someone restores it by hand. Hobby projects in the free
# "hobby" org (scripture-lens, carefulship) get one real database query a day
# so they never go idle. Only 200 passes. scripture-lens returned 401 from a
# private table, which counted as a pass, and it paused on 2026-10-30 anyway, so
# it now calls keepalive(). Anything else fails the job so GitHub emails.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scripture-lens
            ref: elvtjtjcbqbbvgxxobbv
            endpoint: rpc/keepalive
            key: SCRIPTURE_LENS_ANON_KEY
          - name: carefulship
            ref: olvlpfrniwryksmqhocv
            endpoint: sites?select=id&limit=1
            key: CAREFULSHIP_ANON_KEY
    steps:
      - name: Query ${{ matrix.name }}
        env:
          ANON_KEY: ${{ secrets[matrix.key] }}
          REF: ${{ matrix.ref }}
          ENDPOINT: ${{ matrix.endpoint }}
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::error::secret ${{ matrix.key }} is not set"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            "https://${REF}.supabase.co/rest/v1/${ENDPOINT}" \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}") || code=000
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::${{ matrix.name }} keep-alive got HTTP ${code}. HTTP 000 means the project may be paused."
            exit 1
          fi
